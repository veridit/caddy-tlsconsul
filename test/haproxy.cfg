global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# TLS passthrough (L4) - load balances TLS connections to Caddy instances.
# Round-robin ensures validation requests hit different nodes.
frontend ft_tls
    bind *:443
    default_backend bk_caddy_tls

backend bk_caddy_tls
    balance roundrobin
    server caddy1 caddy1:443 check
    server caddy2 caddy2:443 check
    server caddy3 caddy3:443 check
    server caddy4 caddy4:443 check

# HTTP forwarding
frontend ft_http
    bind *:80
    default_backend bk_caddy_http

backend bk_caddy_http
    balance roundrobin
    server caddy1 caddy1:80 check
    server caddy2 caddy2:80 check
    server caddy3 caddy3:80 check
    server caddy4 caddy4:80 check

# Stats/health
frontend ft_health
    bind *:8404
    mode http
    default_backend bk_health

backend bk_health
    mode http
    balance roundrobin
    option httpchk GET /health
    server caddy1 caddy1:8080 check
    server caddy2 caddy2:8080 check
    server caddy3 caddy3:8080 check
    server caddy4 caddy4:8080 check
